    post('SPLIT '+pick1+' '+pick2+' '+pct,null,function(j){busy=false;pick1=pick2=null;setTimeout(refresh,800);});});
  attachEdit(t,'app',a.pkg,null);return t;}
function appById(id){for(var i=0;i<apps.length;i++)if(apps[i].pkg===id)return apps[i];}
/* ── 편집(꾹) 공통 ── */
function attachEdit(t,which,id,longAlt){var x=el('span','x','✕');t.appendChild(x);x.addEventListener('click',function(e){e.stopPropagation();var L2=layout[which];L2.hidden.push(id);L2.order=L2.order.filter(function(i){return i!==id;});paintAll();});
  t.addEventListener('pointerdown',function(e){if(edit){dragStart(e,t,which);return;}var sx=e.clientX,sy=e.clientY;clearTimeout(pressT);pressT=setTimeout(function(){if(longAlt)longAlt();else setEdit(true);},750);
    var mv=function(ev){if(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy)>10)clearTimeout(pressT);};   /* 드래그·스크롤(10px↑ 이동)이면 편집모드 취소 */
    var up=function(){clearTimeout(pressT);t.removeEventListener('pointermove',mv);t.removeEventListener('pointerup',up);t.removeEventListener('pointerleave',up);t.removeEventListener('pointercancel',up);};
    t.addEventListener('pointermove',mv);t.addEventListener('pointerup',up);t.addEventListener('pointerleave',up);t.addEventListener('pointercancel',up);});}
function dragStart(e,t,which){dragging=t;dragging.which=which;t.classList.add('drag');if(t.setPointerCapture)t.setPointerCapture(e.pointerId);}
Object.keys(grids).forEach(function(k){var g=grids[k];g.addEventListener('pointermove',function(e){if(!dragging||dragging.which!==k)return;var under=document.elementFromPoint(e.clientX,e.clientY);var tt=under&&under.closest('.tile');if(!tt||tt===dragging||tt.parentNode!==g)return;var rect=tt.getBoundingClientRect();var before=screen.dataset.mode==='l'?(e.clientY<rect.top+rect.height/2):(e.clientX<rect.left+rect.width/2);g.insertBefore(dragging,before?tt:tt.nextSibling);});
  function end(){if(!dragging||dragging.which!==k)return;dragging.classList.remove('drag');layout[k].order=Array.prototype.map.call(g.children,function(n){return n.dataset.id;});dragging=null;saveLayout(k);}g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);});
/* ── 그리기 ── */
function trayBtn(label,iconHtml,imgSrc,onClick){var b=el('button');b.type='button';if(imgSrc){var im=el('img');im.alt='';im.src=imgSrc;b.appendChild(im);}else if(iconHtml){var s=el('span');s.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round">'+iconHtml+'</svg>';b.appendChild(s);}b.appendChild(el('span',null,label));b.addEventListener('click',onClick);return b;}
function paintCar(){var g=grids.car,tr=trays.car;g.innerHTML='';tr.innerHTML='';var Lc=layout.car;caps.forEach(function(c){if(Lc.order.indexOf(c.id)<0&&Lc.hidden.indexOf(c.id)<0)Lc.order.push(c.id);});Lc.order=Lc.order.filter(byId);
  Lc.order.forEach(function(id){var c=byId(id);if(c&&Lc.hidden.indexOf(id)<0){g.appendChild(tileCar(c));repaint(id);}});tr.appendChild(el('span',null,'숨김'));var hs=Lc.hidden.filter(byId);if(!hs.length)tr.appendChild(el('span',null,'없음'));
  hs.forEach(function(id){var c=byId(id);tr.appendChild(trayBtn(c.label,ICON[c.id]||null,null,function(){Lc.hidden=Lc.hidden.filter(function(i){return i!==id;});Lc.order.push(id);paintAll();}));});saveLayout('car');}
function paintApps(){var g=grids.app,tr=trays.app;g.innerHTML='';tr.innerHTML='';var La=layout.app;apps.forEach(function(a){if(La.order.indexOf(a.pkg)<0&&La.hidden.indexOf(a.pkg)<0)La.order.push(a.pkg);});La.order=La.order.filter(appById);
  La.order.forEach(function(id){var a=appById(id);if(a&&La.hidden.indexOf(id)<0)g.appendChild(tileApp(a));});tr.appendChild(el('span',null,'숨김'));var hs=La.hidden.filter(appById);if(!hs.length)tr.appendChild(el('span',null,'없음'));
  hs.forEach(function(id){var a=appById(id);tr.appendChild(trayBtn(a.label||id,L.grid,a.icon?'/icon/'+encodeURIComponent(a.icon):null,function(){La.hidden=La.hidden.filter(function(i){return i!==id;});La.order.push(id);paintAll();}));});saveLayout('app');}
function paintAll(){if(!M)return;paintCar();paintModes();paintApps();}
/* ── 매니페스트/상태 폴링 ── */
var fails=0;
function refresh(){fetch('/manifest',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){fails=0;setOnline(true);var first=!M;M=j;vin=j.vin||'x';parked=!!j.parked;state=j.state||{};split=j.split||null;
    var newCaps=j.caps||[],newApps=j.apps||[];var capsChanged=!caps.length||newCaps.map(function(c){return c.id;}).join()!==caps.map(function(c){return c.id;}).join();var appsChanged=newApps.map(function(a){return a.pkg;}).join()!==apps.map(function(a){return a.pkg;}).join();
    caps=newCaps;apps=newApps;document.getElementById('car').textContent=(j.modelName||'리모컨');tabsEl.hidden=!apps.length;
    Mirror.onManifest(j);
    if(first){layout.car=ls(LK('car'))||{order:[],hidden:[]};layout.app=ls(LK('app'))||{order:[],hidden:[]};caps.forEach(function(c){if(values[c.id]==null){var lv=liveVal(c);if(lv!=null&&(c.type==='step'||(c.steps||[]).some(function(s){return s.v===lv;})))values[c.id]=lv;else{var sv=ls('ll_val_'+vin+'_'+c.id);if(c.type==='step'&&sv!=null&&sv>=c.min&&sv<=c.max)values[c.id]=sv;else if(c.type==='step')values[c.id]=c.id==='ac_temp'?Math.min(c.max,Math.max(c.min,22)):c.min;else values[c.id]=(c.steps&&c.steps[0])?c.steps[0].v:0;}}});
      if(split&&split.active){var r=RATIOS.filter(function(x){return x[2]===split.pct;})[0];if(r)mode=r[0];}
      paintAll();relayout();}
    else{if(capsChanged||appsChanged)paintAll();else{applyLive();Array.prototype.forEach.call(document.querySelectorAll('.tile.app'),function(t){t.classList.toggle('gated',mode!=='full'&&(appById(t.dataset.id)||{}).split===false);});Array.prototype.forEach.call(grids.app.children,function(t){var a=appById(t.dataset.id);t.classList.toggle('split-on',!!(split&&split.active&&a&&(split.p1===a.pkg||split.p2===a.pkg)));});}}
  }).catch(function(){if(++fails>=3)setOnline(false);});}
function setOnline(o){online=o;screen.classList.toggle('off',!o);dot.classList.toggle('off',!o);}
/* ── 가상 디스플레이 미러(2단계) — ws://<host>:<port>/mirror?app=<pkg> → WebCodecs H.264 → canvas, 포인터→터치 주입 ── */
var Mirror=(function(){
  var port=0,ws=null,dec=null,jm=null,cfgBytes=null,configured=false,painting=false,autoDone=false,playing=false;
  var stage=document.getElementById('mstage'),canvas=document.getElementById('mcanvas'),video=document.getElementById('mvideo'),cctx=canvas.getContext('2d');
  var stat=document.getElementById('mstat'),back=document.getElementById('mback'),backKey=document.getElementById('mback2'),stopBtn=document.getElementById('mstop');
  var vw=1280,vh=720,lastFrame=null,curPkg='';
  /* 하단 독바(2026-09-12 운영자 "세컨드스크린 앱을 끌 방법이 없다"): ◀ 이전=KEYCODE_BACK 주입, ■ 종료=릴레이 force-stop 후 닫기 */
  backKey&&backKey.addEventListener('click',function(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({key:4}));});
  stopBtn&&stopBtn.addEventListener('click',function(){if(ws&&ws.readyState===1&&curPkg){try{ws.send(JSON.stringify({stop:curPkg}));}catch(e){}}setTimeout(close,150);});
  /* 디코더 2경로: WebCodecs(Safari·데스크톱) → MSE+jmuxer(Android 크롬: http는 보안컨텍스트가 아니라 VideoDecoder가 없음. MSE는 http 허용) */
  var wc=('VideoDecoder' in window);
  var mse=!wc&&!!(window.MediaSource&&window.JMuxer&&window.MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"'));
  var surf=wc?canvas:video;canvas.hidden=!wc;video.hidden=wc;
  back&&back.addEventListener('click',function(){close();});
  function available(){return port>0&&(wc||mse);}
  function onManifest(j){port=j.mirrorPort|0;
    /* ?mirror=<pkg> — 앱(iOS SFSafariViewController)에서 바로 미러로 진입. 첫 manifest 수신 후 1회만 */
    if(!autoDone&&port>0){var q=/[?&]mirror=([^&]+)/.exec(location.search);if(q){autoDone=true;var pkg=decodeURIComponent(q[1]),a=(j.apps||[]).filter(function(x){return x.pkg===pkg;})[0];open(pkg,a?(a.label||pkg):pkg);}}}
  function open(pkg,label){if(port<=0){toast('미러 서버가 아직 준비되지 않았어요');return;}
    if(!wc&&!mse){toast('이 브라우저는 미러를 지원하지 않아요(Safari 16.4+/크롬)');return;}
    stage.hidden=false;stage.classList.add('show');stat.textContent=(label||'')+' 연결 중…';connect(pkg);}   /* ★hidden 속성도 내려야 한다 — 전역 [hidden]{display:none!important}가 .show를 이겨 스테이지가 영영 안 떴음(473~478 버그) */
  function close(){stage.classList.remove('show');stage.hidden=true;disconnect();}
  function connect(pkg){disconnect();curPkg=pkg;
    var host=location.hostname;var url='ws://'+host+':'+port+'/mirror?app='+encodeURIComponent(pkg);
    try{ws=new WebSocket(url);}catch(e){stat.textContent='연결 실패';return;}
    ws.binaryType='arraybuffer';
    ws.onopen=function(){stat.textContent='스트림 대기…';};
    ws.onclose=function(){stat.textContent='연결 종료';};
    ws.onerror=function(){stat.textContent='연결 오류';};
    ws.onmessage=function(ev){if(typeof ev.data==='string'){onText(ev.data);}else{onPacket(new Uint8Array(ev.data));}};}
  function disconnect(){try{if(ws){ws.onmessage=ws.onclose=null;ws.close();}}catch(e){}ws=null;try{if(dec&&dec.state!=='closed')dec.close();}catch(e){}dec=null;
    try{if(jm)jm.destroy();}catch(e){}jm=null;playing=false;try{video.pause();video.removeAttribute('src');video.load();}catch(e){}configured=false;cfgBytes=null;}
  function onText(s){try{var o=JSON.parse(s);if(o.t==='meta'){vw=o.w||1280;vh=o.h||720;canvas.width=vw;canvas.height=vh;stat.textContent=vw+'×'+vh+' 대기…';}else if(o.t==='error'||o.t==='end'){stat.textContent=o.m||'종료';}}catch(e){}}
  function avcCodec(cfg){ // AnnexB SPS에서 avc1.PPCCLL 유도(못 찾으면 baseline)
    for(var i=0;i+4<cfg.length;i++){if(cfg[i]===0&&cfg[i+1]===0&&cfg[i+2]===0&&cfg[i+3]===1&&(cfg[i+4]&0x1f)===7){var p=cfg[i+5],c=cfg[i+6],l=cfg[i+7];return 'avc1.'+h2(p)+h2(c)+h2(l);}}return 'avc1.42e01e';}
  function h2(n){return ('0'+(n&0xff).toString(16)).slice(-2);}
  function onPacket(buf){var body=buf.subarray(8);
    var isConfig=(buf[0]&0x80)!==0,isKey=(buf[0]&0x40)!==0;   // bit63/bit62 = 최상위 바이트
    if(mse){feedMse(body,isConfig);return;}
    if(isConfig){cfgBytes=body.slice();return;}
    if(!configured){if(!cfgBytes)return;setupDecoder();}
    if(!dec||dec.state==='closed')return;
    try{var chunkData=body,type='delta';
      if(isKey){var m=new Uint8Array(cfgBytes.length+body.length);m.set(cfgBytes,0);m.set(body,cfgBytes.length);chunkData=m;type='key';}
      dec.decode(new EncodedVideoChunk({type:type,timestamp:performance.now()*1000,data:chunkData}));
    }catch(e){stat.textContent='디코드 오류';}}
  function setupDecoder(){try{
    dec=new VideoDecoder({output:function(frame){if(lastFrame)lastFrame.close();lastFrame=frame;if(!painting){painting=true;requestAnimationFrame(draw);}},error:function(e){stat.textContent='디코더 오류';}});
    dec.configure({codec:avcCodec(cfgBytes),optimizeForLatency:true});configured=true;stat.textContent='';}catch(e){stat.textContent='디코더 설정 실패';configured=false;}}
  function draw(){painting=false;if(!lastFrame)return;try{cctx.drawImage(lastFrame,0,0,canvas.width,canvas.height);}catch(e){}lastFrame.close();lastFrame=null;}
  /* MSE 경로: scrcpy AnnexB AU(config=SPS/PPS 먼저)를 jmuxer가 fMP4로 묶어 <video>에 append. muted+playsinline이라 제스처 없이도 재생 */
  function feedMse(body,isConfig){
    if(!jm){try{jm=new JMuxer({node:'mvideo',mode:'video',flushingTime:50,fps:30,clearBuffer:true,debug:false,onError:function(){stat.textContent='디코더 오류';}});}catch(e){stat.textContent='디코더 설정 실패';return;}}
    try{jm.feed({video:body});}catch(e){stat.textContent='디코드 오류';return;}
    if(!isConfig&&!playing){playing=true;stat.textContent='';var p=video.play();if(p&&p.catch)p.catch(function(){});}}
  // 포인터 → 프레임 좌표(레터박스 보정) → 터치 주입. canvas/video 둘 다 max-width/height 100%라 요소 박스=프레임 비율.
  function map(ev){var r=surf.getBoundingClientRect();var x=(ev.clientX-r.left)/r.width*vw,y=(ev.clientY-r.top)/r.height*vh;return {x:Math.max(0,Math.min(vw-1,Math.round(x))),y:Math.max(0,Math.min(vh-1,Math.round(y)))};}
  function tsend(a,ev){if(!ws||ws.readyState!==1)return;var p=map(ev);try{ws.send(JSON.stringify({a:a,x:p.x,y:p.y}));}catch(e){}}
  var down=false,moveT=0;
  surf.addEventListener('pointerdown',function(ev){ev.preventDefault();down=true;surf.setPointerCapture&&surf.setPointerCapture(ev.pointerId);tsend(0,ev);});
  surf.addEventListener('pointermove',function(ev){if(!down)return;var n=performance.now();if(n-moveT<40)return;moveT=n;tsend(2,ev);});
  surf.addEventListener('pointerup',function(ev){if(!down)return;down=false;tsend(1,ev);});
  surf.addEventListener('pointercancel',function(ev){if(down){down=false;tsend(1,ev);}});
  return {onManifest:onManifest,available:available,open:open};
})();
refresh();setInterval(refresh,2000);
})();
